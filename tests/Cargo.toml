[package]
name = "tests"
version = "0.9.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
my-http-server = { path = "../my-http-server", features = [
    "controllers",
    "macros",
] }

serde = { version = "*", features = ["derive"] }
serde_json = "*"
my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git", features = [
    "server",
] }

# The `#[http_body_as_stream]` end-to-end test drives a real server over a raw TCP socket — the
# only way to check how hyper behaves on the wire (chunked vs Content-Length, an aborted upload,
# an action that answers without draining the body).
[dev-dependencies]
tokio = { version = "*", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git" }
# A real HTTP/2 client, for the one thing raw bytes can not express conveniently: aborting an
# upload with RST_STREAM(NO_ERROR) — which hyper reports to the server as an ordinary end of body,
# not as an error.
h2 = "0.4"
http = "1"
bytes = "1"
