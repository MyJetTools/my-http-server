[package]
name = "my-http-server-core"
version = "0.9.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
with-telemetry = ["dep:my-telemetry"]


[dependencies]
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "with-tokio",
] }

my-json = { tag = "0.3.2", git = "https://github.com/MyJetTools/my-json.git" }

my-telemetry = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-telemetry.git", optional = true }

my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git", features = [
    "server",
] }


futures = "*"

tokio = { version = "*", features = ["net", "rt-multi-thread", "macros", "time"] }

lazy_static = "*"
hyper = { version = "*", features = ["http1", "http2", "server"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde_yaml = "*"
async-trait = "*"
http-body-util = "*"
hyper-util = { version = "*", features = ["tokio", "server-auto"] }
flate2 = "*"
brotli-decompressor = "*"
# Pure Rust, and a decoder only - which is all a server does to a request body. No C toolchain,
# so it costs the build nothing to carry unconditionally.
ruzstd = "*"
http = "*"
bytes = "*"
my-hyper-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-hyper-utils.git" }

# `Content-Encoding: aes128gcm` (RFC 8188): request bodies opened with `BodyEncryptionKeys`, and
# `HttpResultBuilder::encode`. RustCrypto is pure Rust, like the decoders above, so no C toolchain.
# The majors are pinned, unlike the rest: hmac and sha2 have to agree on `digest`, and these crates
# change their API between majors.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4"
zeroize = "1"
base64 = "0.23"

[dev-dependencies]
# `tokio::io::duplex` and the read/write extensions, for the tests of `ProtocolSniffDeadline`.
tokio = { version = "*", features = ["io-util"] }
